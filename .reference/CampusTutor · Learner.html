<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusTutor · Learner Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sb:#003c20;--sb-act:#085a33;--yellow:#fcc802;--yellow2:#fec603;--tutorbtn:#002715;
  --g:#01572b;--g2:#0b6b33;--g-soft:#f3fbf5;--g-pill:#d5f5e4;--g-text:#0a7a3b;
  --ink:#101418;--ink2:#3d4450;--mute:#6b7280;--line:#e6e8eb;--line2:#eef0f2;--bg:#ffffff;--bg2:#fafbfa;
  --blue:#1f3fb0;--link:#1d5fd1;--star:#fdb608;--red:#d92d20;--red-soft:#fff1f1;--amber:#c27c0e;--amber-line:#f3c26b;--amber-soft:#fff9ef;
  --pend:#dbeafe;--pend-t:#1d4ed8;--r:10px;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
img{max-width:100%}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.lg{width:26px;height:26px}
.ic.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* layout */
.app{display:flex;min-height:100vh}
.sb{width:268px;flex-shrink:0;background:linear-gradient(180deg,#003b1f,#003f23);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.sb .logo{display:block;height:86px;width:266px;background:#003b1f}
.sb .logo img{display:block;width:266px;height:86px}
.rs{display:flex;margin:18px 26px 16px;background:var(--tutorbtn);border-radius:8px;padding:0}
.rs button{flex:1;border:0;background:transparent;color:#fff;font-weight:500;padding:9px 0;border-radius:6px;font-size:14px}
.rs button.on{background:var(--yellow2);color:#1a1a1a;font-weight:600}
.nav{list-style:none;margin:0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:14px;border:0;background:transparent;color:#fff;padding:10px 26px;font-size:15px;font-weight:500;text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:var(--sb-act)}
.nav button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--yellow)}
.nav .bdg{margin-left:auto;background:var(--yellow);color:#363d03;font-size:12px;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center}
.sb hr{border:0;border-top:1px solid rgba(255,255,255,.18);margin:12px 22px}
.sb .acc{color:var(--yellow);font-weight:600;font-size:13.5px;padding:8px 26px 6px}
.sb .campus{margin-top:auto;display:block;width:266px}
.sb .campus img{display:block;width:266px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:88px;display:flex;align-items:center;gap:18px;padding:0 36px 0 42px;border-bottom:1px solid var(--line2);background:#fff;position:sticky;top:0;z-index:4}
.gsearch{flex:0 1 594px;position:relative}
.gsearch input{width:100%;height:48px;border:1px solid #dcdfe3;border-radius:8px;padding:0 50px 0 22px;font-size:15px;background:#fff}
.gsearch button{position:absolute;right:10px;top:9px;border:0;background:none;color:#4b5563;padding:4px}
.gsearch button .ic{width:26px;height:26px}
.top .sp{flex:1}
.ibtn{border:0;background:none;color:#4b5563;position:relative;padding:6px;border-radius:8px}
.ibtn:hover{background:#f3f4f6}
.ibtn .ic{width:26px;height:26px}
.ibtn .n{position:absolute;top:-3px;right:-2px;background:#0b6b33;color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;border:2px solid #fff}
.umenu{display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 6px;border-radius:10px;text-align:left}
.umenu:hover{background:#f6f7f8}
.av0{width:44px;height:44px;border-radius:50%;background:#e8e9eb;display:grid;place-items:center;overflow:hidden;color:#9ca0a6}
.av0 img{width:100%;height:100%;object-fit:cover}
.umenu b{display:block;font-size:14.5px;font-weight:600}.umenu small{color:var(--mute);font-size:14px}
.main{padding:22px 38px 48px 42px;background:#fff;flex:1}
.ph h1{font-size:33px;font-weight:700;margin:4px 0 2px;letter-spacing:-.4px}
.ph p{margin:0 0 20px;color:var(--blue);font-size:15.5px}
.ph p.gr{color:#4b5563}
.row{display:flex;gap:16px;align-items:center}
.muted{color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:7px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn.p{background:var(--g);color:#fff}.btn.p:hover{background:#004822}
.btn.o{background:#fff;color:var(--g);border-color:var(--g)}.btn.o:hover{background:var(--g-soft)}
.btn.gh{background:#fff;color:var(--ink2);border-color:#d8dbdf;font-weight:500}.btn.gh:hover{background:#f7f8f9}
.btn.am{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);font-weight:500;font-size:12.5px}
.btn.rd{background:#fff;color:var(--red);border-color:#f3a3a3}.btn.rd:hover{background:var(--red-soft)}
.btn.rdf{background:var(--red);color:#fff}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.w{width:100%}.btn.lg{height:46px;font-size:15px}
.link{border:0;background:none;color:var(--g);font-weight:600;padding:0;display:inline-flex;align-items:center;gap:4px}

/* forms */
.fl{display:block;font-weight:600;font-size:14px;margin:0 0 7px}
.in,.sel,.ta{width:100%;border:1px solid #dcdfe3;border-radius:7px;height:42px;padding:0 14px;background:#fff;font-size:14.5px}
.ta{height:auto;padding:11px 14px;resize:vertical;min-height:90px;line-height:1.5}
.in[readonly],.in:disabled,.sel:disabled{background:#f7f8f9;color:#5b6270}
.selw{position:relative}.selw .sel{appearance:none;-webkit-appearance:none;padding-right:38px;color:#4b5563;cursor:pointer}
.selw .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#4b5563}
.err{color:var(--red);font-size:12.5px;margin-top:5px}
.fg{margin-bottom:16px}
.lockn{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-weight:500;font-size:12px;margin-left:6px}
.tog{width:40px;height:23px;border-radius:12px;background:#d1d5db;border:0;position:relative;flex-shrink:0;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--g2)}.tog.on::after{left:20px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{margin-top:3px;accent-color:var(--g);width:16px;height:16px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{height:38px;padding:0 20px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:10px}
.chip:hover{border-color:#c9cdd2}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip.cat{height:44px;padding:0 22px}
.chip.cat .ic{color:var(--g)}.chip.cat.on .ic{color:#fff}
.chip .ic.o{color:#e59b0c}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--g-soft);color:var(--g);border:1px solid #cfe9d7;border-radius:16px;padding:4px 8px 4px 12px;font-size:13px;font-weight:600}
.fchip button{border:0;background:none;color:var(--g);padding:0;display:grid;place-items:center}
.tagp{display:inline-flex;align-items:center;background:#e6f5ea;color:#0b6b33;border-radius:14px;padding:5px 12px;font-size:12.5px;font-weight:500}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.paid,.pill.ok{background:#e3f4e8;color:#0b6b2c}
.pill.pend{background:var(--pend);color:var(--pend-t)}
.pill.warn{background:#fff3d6;color:#9a6200}
.pill.bad{background:#fde8e8;color:#b42318}
.pill.gray{background:#eef0f2;color:#555c66}
.stat{position:absolute;top:14px;left:14px;font-size:12px;font-weight:600;border-radius:10px;padding:2px 9px}
.stat.on{background:var(--g-pill);color:var(--g-text)}.stat.off{background:#eef0f2;color:#6b7280}
.vbadge{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--g-text);font-size:12.5px;font-weight:600;border-radius:12px;padding:2px 9px 2px 3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vbadge .ic{color:var(--g);fill:var(--g);stroke:#fff}

/* tutor cards */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.tc{position:relative;padding:16px 18px 16px;text-align:center}
.tc .bm{position:absolute;top:12px;right:14px;border:0;background:none;color:var(--g);padding:4px}
.tc .bm .ic{width:26px;height:26px}
.tc .bm.on .ic{fill:var(--g)}
.tc .ph0{position:relative;width:100px;height:100px;margin:0 auto 6px}
.tc .ph0 img{width:100px;height:100px;border-radius:50%;display:block}
.tc .ph0 .vbadge{position:absolute;left:92px;bottom:6px}
.tc h3{margin:6px 0 2px;font-size:17px;font-weight:700}
.tc .prog{color:#555c66;font-size:14.5px}
.tc .spec{color:#555c66;font-size:14px;margin-top:2px}
.rat{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14.5px;color:#555c66}
.rat .ic{color:var(--star);fill:var(--star);width:17px;height:17px}
.rat b{color:#e59b0c;font-weight:500}
.price{font-size:18px;font-weight:700;color:var(--g2);margin:4px 0 12px}
.price span{font-weight:400;color:#555c66}
.tc .acts{display:flex;gap:18px;justify-content:center}
.tc .acts .btn{flex:1;max-width:128px}
.tlist .tc{display:grid;grid-template-columns:100px 1fr auto;gap:22px;text-align:left;align-items:center;margin-bottom:14px;padding:18px 22px}
.tlist .tc .stat{position:static;display:inline-block;margin-bottom:6px}
.tlist .tc .bm{top:14px;right:16px}
.tlist .tc .acts{flex-direction:column;gap:10px;margin-right:36px}
.tlist .tc .acts .btn{width:140px;max-width:none}
.tlist .tc .ph0 .vbadge{display:none}
.emptyb{text-align:center;padding:40px 20px;background:var(--g-soft);border-radius:var(--r)}
.emptyb .circ{width:58px;height:58px;border-radius:50%;background:#e3f4e8;display:grid;place-items:center;margin:0 auto 12px;color:var(--g)}
.emptyb h3{margin:0 0 4px;font-size:19px}

/* filters */
.fbox{padding:18px 18px 20px;margin-bottom:22px}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:38px;margin-bottom:22px}
.flbl{font-weight:600;font-size:14.5px;margin:0 0 10px}
.popw{position:relative;display:inline-block}
.pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,20,24,.12);min-width:200px;padding:6px}
.pop.r{left:auto;right:0}
.pop button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:7px;text-align:left;font-size:14px}
.pop button:hover{background:#f4f6f5}
.pop button.on{color:var(--g);font-weight:600;background:var(--g-soft)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:5px 0}

/* banner */
.vban{display:flex;gap:14px;align-items:center;background:var(--g-soft);border-radius:8px;padding:10px 20px;margin-bottom:16px}
.vban .ic{width:34px;height:34px;color:var(--g);fill:var(--g);stroke:#fff}
.vban b{color:#075520;font-weight:600;font-size:15px}.vban div div{font-size:13px;color:#374151}
.note{display:flex;gap:14px;align-items:flex-start;border-radius:10px;padding:16px 20px;background:#eef5ff}
.note .ic{color:#1d5fd1;width:30px;height:30px}
.note.g{background:var(--g-soft)}.note.g .ic{color:var(--g)}
.note.w{background:#fff7e6;border:1px solid #f6dca3}.note.w .ic{color:#b7791f}
.note.r{background:var(--red-soft);border:1px solid #f7c8c8}.note.r .ic{color:var(--red)}
.note b{display:block;margin-bottom:2px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-bottom:18px}
.scard{display:flex;align-items:center;gap:22px;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r);background:#fff;text-align:left;width:100%}
.scard:hover{border-color:#cfd3d8}
.scard.y{background:#fffcf5;border-color:#f7ecd2}
.scard .ci{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.scard .ci .ic{width:32px;height:32px}
.scard .ci.g{background:#0b6b33}.scard .ci.o{background:#f0a70a}
.scard .n{font-size:27px;font-weight:700;line-height:1.1}
.scard .t{font-size:14px;color:#374151}.scard .s{font-size:14px;color:var(--mute)}
.dtc .tc{padding:12px 18px 14px}
.dtc .tc .ph0,.dtc .tc .ph0 img{width:92px;height:92px}
.dtc .tc h3{font-size:15px}
.dtc .tc .spec{font-size:12px}
.dtc .rat{font-size:12.5px}
.dtc .price{font-size:15px;margin:2px 0 10px}
.dtc .tc .acts .btn{height:34px;font-size:13px;max-width:104px;font-weight:500}
.dtc .bm .ic{width:22px;height:22px}

/* sessions */
.tabs{display:flex;gap:34px;border-bottom:1px solid var(--line2);align-items:flex-end}
.tabs button{border:0;background:none;padding:12px 2px 13px;font-size:16px;color:#555c66;position:relative;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.tabs button.on{color:var(--g);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--g);border-radius:2px}
.tabs .cnt{background:#233a6b;color:#fff;font-size:11.5px;border-radius:10px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.sc{display:grid;grid-template-columns:70px 250px 1fr 190px 1fr 90px 290px;gap:16px;padding:20px 22px;margin-bottom:14px;align-items:start}
.sc .dt{text-align:center;padding-top:20px;font-weight:600;color:#1f2937;font-size:14px;line-height:1.35}
.sc .dt b{display:block;font-size:26px;font-weight:700}
.sc .who{display:flex;gap:14px;align-items:flex-start}
.sc .who img{width:84px;height:84px;border-radius:50%}
.sc .who h4{margin:12px 0 2px;font-size:16px}
.sc .who .pg{color:var(--link);font-size:13.5px;font-weight:500}
.sc .who .rat{font-size:13.5px;margin-top:2px}
.sc .who .rat span{color:var(--link)}
.ln{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.ln .ic{color:#374151;margin-top:1px}
.ln .sub{font-weight:600;font-size:15px}
.ln .tp{color:#4b5563;font-size:13.5px}
.sc .amt{text-align:right;padding-top:10px}
.sc .amt b{font-size:17px;display:block;margin-bottom:10px}
.sc .act{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line2);padding-left:18px}
.sc .act .two{display:flex;gap:8px}.sc .act .two .btn{flex:1;padding:0 8px;font-size:12.5px}
.sc .act .btn{height:34px}
.sc .ext{font-size:12.5px;color:var(--link);display:inline-flex;gap:4px;align-items:center;border:0;background:none;padding:0;text-decoration:none;margin-top:6px}
.sc .ext:hover{text-decoration:underline}
.rsbar{grid-column:1/-1;margin-top:-4px}
.meet{width:22px;height:22px;flex-shrink:0}
.ftitle{font-size:17px;font-weight:600;margin:20px 0 14px}
.empty{padding:50px 20px;text-align:center;color:var(--mute)}
.empty .ic{width:40px;height:40px;color:#9aa1a9;margin-bottom:8px}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,14,.42);display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .15s ease}
.ov.dr{justify-content:flex-end;padding:0}
@keyframes fi{from{opacity:0}to{opacity:1}}
.md{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.2);animation:up .18s ease}
.md.lg{width:900px}.md.sm{width:440px}.md.xl{width:1040px}
@keyframes up{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.dr .md{border-radius:0;height:100vh;max-height:100vh;width:600px;animation:sl .2s ease}
@keyframes sl{from{transform:translateX(30px)}to{transform:none}}
.mh{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line2)}
.mh h2{margin:0;font-size:20px;font-weight:700;flex:1}
.mh .x{border:0;background:none;color:#4b5563;padding:6px;border-radius:8px}.mh .x:hover{background:#f3f4f6}
.mb{padding:20px 24px;overflow:auto;flex:1}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line2)}
.mf .l{margin-right:auto}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;font-size:14.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500}
.sech{font-size:13px;color:var(--mute);font-weight:600;margin:22px 0 10px}
.dlg{text-align:center;padding:28px 28px 22px}
.dlg .ci{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#fde8e8;color:var(--red)}
.dlg .ci.g{background:#e3f4e8;color:var(--g)}
.dlg h2{margin:0 0 6px;font-size:21px}
.dlg p{margin:0 0 20px;color:#4b5563}
.dlg .bb{display:flex;gap:12px;justify-content:center}.dlg .bb .btn{min-width:130px}

/* stepper */
.stp{display:flex;gap:0;padding:14px 24px;border-bottom:1px solid var(--line2);overflow-x:auto}
.stp div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.stp div:not(:last-child)::after{content:"";width:28px;height:1px;background:#d6d9dd;margin:0 10px}
.stp i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1.5px solid #cfd3d8;display:grid;place-items:center;font-size:12px;font-weight:600}
.stp .on{color:var(--g);font-weight:600}.stp .on i{border-color:var(--g);background:var(--g);color:#fff}
.stp .dn{color:var(--g)}.stp .dn i{border-color:var(--g);color:var(--g)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.opt:hover{border-color:#bcc3ca}
.opt.on{border-color:var(--g);background:var(--g-soft);box-shadow:inset 0 0 0 1px var(--g)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid #c3c8ce;flex-shrink:0}
.opt.on .rd{border:5px solid var(--g)}
.opt b{display:block;font-size:15px}.opt small{color:var(--mute);font-size:13px}
.cal{border:1px solid var(--line);border-radius:10px;padding:14px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.cal .hd button{border:1px solid var(--line);background:#fff;border-radius:7px;width:32px;height:32px;display:grid;place-items:center}
.cal .hd button:disabled{opacity:.35;cursor:not-allowed}
.cal .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{height:38px;border-radius:8px;border:0;background:none;font-size:14px;color:#b6bbc2;cursor:not-allowed}
.cal .d.av{color:var(--ink);background:var(--g-soft);cursor:pointer;font-weight:600}
.cal .d.av:hover{background:#dcf1e2}
.cal .d.on{background:var(--g);color:#fff}
.cal .d.today{box-shadow:inset 0 0 0 1.5px #9aa1a9}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{height:40px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-weight:500;font-size:13.5px}
.slot:hover{border-color:#aab1b8}
.slot.on{border-color:var(--g);background:var(--g);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:500;font-size:13.5px}
.seg button.on{background:var(--g);color:#fff}
.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.sumrow span:first-child{color:var(--mute)}.sumrow span:last-child{font-weight:600;text-align:right}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--g-soft);border-radius:10px;margin-top:14px}
.total b{font-size:22px;color:var(--g)}
/* payment gateway mock */
.gw{border:1px solid #dfe3e8;border-radius:12px;overflow:hidden;max-width:470px;margin:0 auto}
.gw .gh{background:#f5f7fa;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#4b5563;border-bottom:1px solid #e6e9ee}
.gw .gb{padding:20px 22px}
.gcash{background:#0a5ed7;color:#fff;padding:18px 22px;font-weight:700;font-size:20px;letter-spacing:.2px}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #e3f4e8;border-top-color:var(--g);animation:rot 0.9s linear infinite;margin:10px auto 16px}
@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:64px;height:64px;border-radius:50%;background:#e3f4e8;color:var(--g);display:grid;place-items:center;margin:4px auto 14px}
.okc .ic{width:34px;height:34px;stroke-width:2.4}
.email{border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;margin-top:16px}
.email .eh{background:#f7f8f9;padding:10px 14px;font-size:13px;color:#4b5563;border-bottom:1px solid var(--line)}
.email .eb{padding:14px;font-size:13.5px}

/* messages */
.msgw{display:grid;grid-template-columns:440px 1fr;gap:24px;align-items:stretch}
.clist{padding:0;overflow:hidden}
.clist .srch{display:flex;gap:14px;padding:18px 14px 14px}
.clist .srch .in{padding-left:44px;height:46px}
.clist .srch .w{position:relative;flex:1}.clist .srch .w .ic{position:absolute;left:14px;top:13px;color:#4b5563}
.sqb{width:46px;height:46px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--g)}
.ci2{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:#fff;padding:16px 18px}
.ci2:hover{background:#f9faf9}
.ci2.on{background:#f1f7f2}
.ci2 .a{position:relative;width:58px;height:58px;flex-shrink:0}
.ci2 .a img{width:58px;height:58px;border-radius:50%}
.odot{position:absolute;right:1px;bottom:3px;width:13px;height:13px;border-radius:50%;background:#16a34a;border:2px solid #fff}
.ci2 .b{flex:1;min-width:0}
.ci2 .b b{font-size:16px;font-weight:600}
.ci2 .b div{color:#4b5563;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci2.ur .b div{color:var(--ink);font-weight:600}
.ci2 .t{text-align:right;font-size:13px;color:#4b5563;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.ci2 .u{background:#0b6b33;color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;width:21px;height:21px;display:grid;place-items:center}
.chat{display:flex;flex-direction:column;min-height:720px}
.chat .h{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.chat .h img{width:82px;height:82px;border-radius:50%}
.chat .h h3{margin:0;font-size:19px}
.chat .body{flex:1;padding:14px 18px;overflow:auto;max-height:470px}
.dayc{text-align:center;margin:6px 0 12px}.dayc span{background:#f1f3f4;border-radius:12px;padding:4px 14px;font-size:13px;color:#4b5563}
.bub{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.bub img{width:58px;height:58px;border-radius:50%}
.bub .m{background:#f1f3f5;border-radius:10px;padding:10px 16px;max-width:410px;font-size:15px}
.bub .m small{display:block;color:#4b5563;font-size:12.5px;margin-top:6px}
.bub.me{justify-content:flex-end}
.bub.me .m{background:#e6f4ea;text-align:left}
.bub.me .m small{text-align:right}
.bub .tick{color:#16a34a;font-weight:700;letter-spacing:-3px;margin-left:6px}
.mlink{display:flex;gap:10px;align-items:center;border:1px solid #cfe0f7;background:#fff;border-radius:8px;padding:9px 12px;margin-top:8px;width:100%;text-align:left}
.mlink:hover{background:#f6faff}
.mlink b{display:block;font-size:13.5px}.mlink span{font-size:12.5px;color:var(--link)}
.fmsg{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13px}
.comp{display:flex;gap:14px;align-items:center;padding:12px 18px}
.comp .w{flex:1;position:relative}
.comp .in{height:48px;padding-right:48px;font-size:15px}
.comp .emo{position:absolute;right:10px;top:9px;border:0;background:none;color:#4b5563}
.comp .snd{width:66px;height:48px;border-radius:8px;border:0;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.comp .snd:disabled{opacity:.5;cursor:not-allowed}
.typing{font-size:13px;color:var(--mute);padding:0 0 8px 70px}

/* notifications */
.nw{display:grid;grid-template-columns:1fr 324px;gap:24px;align-items:start}
.nl{padding:0;overflow:hidden}
.ni{display:grid;grid-template-columns:52px 1fr auto 14px;gap:16px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:#fff;padding:12px 20px}
.ni:hover{background:#f9faf9}
.ni.ur{background:#f1f7f2}
.ni .c{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.ni b{font-size:16px;font-weight:600;display:block}
.ni .tx{color:#4b5563;font-size:14px}
.ni .tm{color:#4b5563;font-size:13px;white-space:nowrap;align-self:start;padding-top:4px}
.ni .dot{width:11px;height:11px;border-radius:50%;background:#c7cbd0;align-self:start;margin-top:7px}
.ni.ur .dot{background:#0b6b33}
.nf button{display:flex;width:100%;align-items:center;gap:14px;border:0;background:none;padding:10px 12px;border-radius:7px;font-size:14px}
.nf button:hover{background:#f6f7f7}
.nf button.on{background:var(--g-soft);font-weight:600}
.nf button span{margin-left:auto}
.nf .ic{color:var(--g)}

/* profile */
.pw{display:grid;grid-template-columns:320px 1fr 1fr;gap:16px;align-items:start}
.pcard{padding:20px}
.pcard h3{margin:0;font-size:18px;font-weight:600}
.pcard .hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.btn.ed{height:36px;padding:0 20px;font-weight:600}
.side{background:var(--g-soft);border:1px solid #e3efe6;text-align:center;padding:26px 26px}
.bigav{position:relative;width:160px;height:160px;margin:0 auto 10px}
.bigav img{width:160px;height:160px;border-radius:50%;border:5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08);object-fit:cover}
.bigav button{position:absolute;right:6px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;border:3px solid #fff;display:grid;place-items:center}
.side .ln{text-align:left}
.side .ln .ic{color:var(--g);width:24px;height:24px}
.side .ln div{font-size:15px}.side .ln b{font-weight:500;display:block}
.rolec{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:10px;margin-bottom:12px;border:1px solid var(--line)}
.rolec.a{background:var(--g-soft);border-color:#e3efe6}
.rolec .ci{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.upl{border:1.5px dashed #c9cfd5;border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:center;background:#fcfcfc}
.upl.ok{border-style:solid;border-color:#bfe3c9;background:var(--g-soft)}
.upl.bad{border-color:#f2a3a3;background:var(--red-soft)}
.upl b{display:block;font-size:14px}.upl small{color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#e3e6e9}
.tl li.d:not(:last-child)::before{background:#9fd3ae}
.tl .k{width:28px;height:28px;border-radius:50%;border:2px solid #d3d7db;background:#fff;display:grid;place-items:center;flex-shrink:0;z-index:1}
.tl li.d .k{background:var(--g);border-color:var(--g);color:#fff}
.tl li.c .k{border-color:var(--g);box-shadow:0 0 0 4px #e3f4e8}
.tl li.x .k{border-color:var(--red);color:var(--red)}
.tl b{display:block}

/* help */
.hw{display:grid;grid-template-columns:1fr 390px;gap:38px;align-items:start}
.hcat{display:flex;gap:22px;align-items:center;padding:16px 22px;text-align:left;width:100%;background:#fff}
.hcat:hover{border-color:#cfd3d8}
.hcat .ci{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.hcat .ci .ic{width:32px;height:32px}
.hcat b{font-size:17px;display:block;margin-bottom:2px}.hcat span{color:#4b5563;font-size:14px}
.hcat>.ic{margin-left:auto}
.art{display:flex;gap:12px;align-items:center;border:0;background:none;padding:9px 0;color:var(--blue);font-size:15px;width:100%;text-align:left}
.art .ic{color:var(--g)}
.art:hover span{text-decoration:underline}

/* settings */
.stw{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.sh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.sh .ci{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.sh h3{margin:2px 0 4px;font-size:18px}.sh p{margin:0;color:#4b5563;font-size:13.5px}
.nrow{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.nrow .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.nrow b{font-size:14px;display:block}.nrow small{color:#4b5563;font-size:13px}
.nrow .tog{margin-left:auto;margin-top:4px}
.pwi{position:relative}.pwi .in{padding-right:44px}.pwi button{position:absolute;right:8px;top:8px;border:0;background:none;color:#4b5563;padding:3px}

/* reviews */
.rv{display:grid;grid-template-columns:90px 260px 1fr 190px 190px;gap:16px;align-items:center;padding:16px 16px;margin-bottom:14px}
.rv img{width:78px;height:78px;border-radius:50%}
.stars{display:inline-flex;gap:3px;color:var(--star)}
.stars .ic{fill:var(--star);width:22px;height:22px}
.stars .ic.e{fill:#d9dce0;color:#d9dce0}
.starpick{display:flex;gap:6px}
.starpick button{border:0;background:none;padding:2px;color:#d0d4d9}
.starpick button .ic{width:34px;height:34px;fill:currentColor}
.starpick button.on{color:var(--star)}

/* toast + proto */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0f2a1b;color:#fff;border-radius:9px;padding:11px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;animation:up .2s ease}
.toast .ic{color:var(--yellow)}
.toast button{border:0;background:none;color:var(--yellow);font-weight:700;padding:0 0 0 6px}
.proto{position:fixed;right:16px;bottom:16px;z-index:80}
.proto>button{background:#1f2937;color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;gap:6px;align-items:center}
.proto .pp{position:absolute;right:0;bottom:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);width:300px;padding:16px;font-size:13px}
.proto .pp h4{margin:0 0 4px;font-size:14px}
.sbtoggle{display:none}

@media (max-width:1280px){
 .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sc{grid-template-columns:70px 1fr 1fr;}
 .sc .act{grid-column:1/-1;border-left:0;padding-left:0;flex-direction:row;flex-wrap:wrap}
 .sc .amt{text-align:left}
 .stw{grid-template-columns:1fr 1fr}
 .pw{grid-template-columns:1fr 1fr}
 .rv{grid-template-columns:80px 1fr;}
}
@media (max-width:980px){
 .sb{position:fixed;left:0;transform:translateX(-100%);transition:transform .2s}
 .sb.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
 .sbtoggle{display:grid}
 .top{padding:0 16px;gap:10px}.main{padding:18px 16px 40px}
 .umenu .nm{display:none}
 .stats,.frow{grid-template-columns:1fr 1fr;gap:14px}
 .msgw,.nw,.hw,.pw,.stw{grid-template-columns:1fr}
 .kv{grid-template-columns:1fr}
}
@media (max-width:600px){.tgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.sc{grid-template-columns:1fr}.slots{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function slots(tid,date,dur,exclude){
 const t=tut(tid),day=pd(date).getUTCDay(),blocks=t.avail[day]||[];
 const busy=t.busy.filter(b=>b[0]===date).map(b=>[b[1],b[2]]);
 S.sessions.filter(s=>s.tutor===tid&&s.cat==='upcoming'&&s.date===date&&s.id!==exclude).forEach(s=>busy.push([s.start,endOf(s)]));
 // learner's own sessions with other tutors also block (no double booking for learner)
 S.sessions.filter(s=>s.tutor!==tid&&s.cat==='upcoming'&&s.date===date).forEach(s=>busy.push([s.start,endOf(s)]));
 if(exclude){const x=sess(exclude);if(x&&x.date===date)busy.push([x.start,endOf(x)]);}
 const out=[];
 blocks.forEach(([a,b])=>{for(let st=a;st+dur*60<=b;st+=30){const en=st+dur*60;if(!busy.some(([x,y])=>st<y&&en>x))out.push(st);}});
 return out;
}

function tcard(id,variant){
 const t=tut(id),sv=isSaved(id);
 const bm = variant==='dash'
  ? `<button class="bm ${sv?'on':''}" data-a="save" data-v="${id}" aria-label="${sv?'Remove from':'Save to'} Saved Tutors" aria-pressed="${sv}" style="color:${sv?'#d92d20':'#6b7280'}">${ic('heart',sv?'fill':'')}</button>`
  : `<button class="bm ${sv?'on':''}" data-a="save" data-v="${id}" aria-label="${sv?'Remove from':'Save to'} Saved Tutors" aria-pressed="${sv}">${ic('bookmark')}</button>`;
 const st=`<span class="stat ${t.online?'on':'off'}">• ${t.online?'Online':'Offline'}</span>`;
 if(variant==='dash') return `<div class="card tc">${st}${bm}<div class="ph0"><img src="${IMG[id]}" alt=""></div><h3>${t.name}</h3><div class="spec">${t.spec.replace('Web Development','Web Dev')}</div><div class="rat">${ic('star')}<b>${t.rating}</b> (${t.reviews} reviews)</div><div class="price">${peso(t.rate)} <span>/ hour</span></div><div class="acts"><button class="btn o" data-a="profileT" data-v="${id}">View Profile</button><button class="btn p" data-a="book" data-v="${id}">Book Now</button></div></div>`;
 if(variant==='saved') return `<div class="card tc">${st}${bm}<div class="ph0"><img src="${IMG[id]}" alt=""><span class="vbadge" style="left:88px">${ic('shield','sm')}Verified</span></div><h3>${t.name}</h3><div class="prog">${t.prog}</div><div class="spec" style="display:flex;gap:8px;justify-content:center;margin-top:8px;color:#374151">${ic('book','sm')}${t.sspec||t.spec}</div><div class="rat" style="margin-top:12px">${ic('star')}<b>${t.rating}</b> (${t.reviews} reviews)</div><div class="price">${peso(t.rate)} <span>/ hour</span></div><div style="display:flex;gap:8px;justify-content:center;color:${t.online?'var(--g2)':'#4b5563'};font-weight:500;margin:-4px 0 14px">${ic(t.online?'cal':'clock','sm')}${t.online?t.avl:t.seen}</div><div class="acts"><button class="btn o" data-a="profileT" data-v="${id}">View Profile</button><button class="btn p" data-a="book" data-v="${id}">Book Now</button></div></div>`;
 return `<div class="card tc">${S.find.list?'':st}${bm}<div class="ph0"><img src="${IMG[id]}" alt=""><span class="vbadge">${ic('shield','sm')}Verified</span></div><div>${S.find.list?st:''}<h3>${t.name}</h3><div class="prog">${t.prog}</div><div class="spec">${t.spec}</div><div class="rat">${ic('star')}<b>${t.rating}</b> (${t.reviews} reviews)</div><div class="price">${peso(t.rate)} <span>/ hour</span></div></div><div class="acts"><button class="btn o" data-a="profileT" data-v="${id}">View Profile</button><button class="btn p" data-a="book" data-v="${id}">Book Now</button></div></div>`;
}

function findResults(){
 const f=S.find;let ids=FIND_ORDER.slice();
 const q=f.q.trim().toLowerCase();
 if(q) ids=ids.filter(id=>{const t=tut(id);return (t.name+' '+t.spec+' '+t.prog+' '+t.services.map(s=>s.s+' '+s.topics.join(' ')).join(' ')).toLowerCase().includes(q)});
 const subs=[...new Set([f.subject,...f.chips].filter(Boolean))];
 if(subs.length) ids=ids.filter(id=>{const t=tut(id);const all=(t.spec+' '+t.services.map(s=>s.s).join(' ')).toLowerCase();return subs.some(s=>all.includes(s.toLowerCase()))});
 if(f.level) ids=ids.filter(id=>tut(id).levels.includes(f.level));
 if(f.avail) ids=ids.filter(id=>tut(id).tags.includes(f.avail));
 if(f.cat) ids=ids.filter(id=>tut(id).cat===f.cat);
 const so=f.sort;ids.sort((a,b)=>{const A=tut(a),B=tut(b);if(so==='Most Reviews')return B.reviews-A.reviews;if(so==='Price: Low to High')return A.rate-B.rate;if(so==='Price: High to Low')return B.rate-A.rate;return B.rating-A.rating||B.reviews-A.reviews});
 return ids;
}

 if(S.sessDate==='This month (September)')list=list.filter(s=>s.date.startsWith('2026-09'));
 if(S.sessDate==='October 2026')list=list.filter(s=>s.date.startsWith('2026-10'));

 list.sort((a,b)=>tab==='upcoming'?(a.date+a.start).localeCompare(b.date+b.start):(b.date).localeCompare(a.date));

  <div class="row" style="gap:12px;margin-bottom:6px"><div style="width:175px;position:relative">${selx('sessDate',S.sessDate,['All Dates','Next 7 days','This month (September)','October 2026'],'aria-label="Filter by date" style="padding-left:42px;height:42px;color:#1f2937"')}<span style="position:absolute;left:12px;top:10px;pointer-events:none;color:#374151">${ic('cal','sm')}</span></div><div style="width:175px;position:relative">${selx('sessStat',S.sessStat,['All Status','Paid','Pending','Refund Under Review','Refund Declined'],'aria-label="Filter by payment status" style="padding-left:42px;height:42px;color:#1f2937"')}<span style="position:absolute;left:12px;top:11px;pointer-events:none;color:#374151">${ic('filter','sm')}</span></div></div>

 <div style="border-bottom:1px solid var(--line2);margin-top:-1px"></div>
 <div class="ftitle">${titles[tab]}</div>

 </div>`;

V.apply=()=>{
 const a=S.app,ts=S.tutorStatus;
 const back=`<button class="link" data-a="nav" data-v="profile" style="margin-bottom:10px">${ic('back','sm')}Back to Profile</button>`;
 if(a.step==='form'){
  const docs=[['cor','Certificate of Registration (current semester)',true],['tor','Transcript of Records / Grades',true],['id','CarSU Student ID (front)',true],['cert','Supporting certificates',false]];

    <div class="fg"><label class="fl" for="atp">Specific topics</label><input id="atp" class="in" data-m="app.topics" value="${esc(a.topics)}" placeholder="e.g. Python Basics, HTML & CSS Layouts"><div class="muted" style="font-size:12.5px;margin-top:4px">Separate topics with commas.</div></div>

    <div class="fg"><label class="fl">Session types</label><div class="row" style="gap:18px;height:42px">${['Online','In-Person'].map(x=>`<label class="chk"><input type="checkbox" data-a="apptype" data-v="${x}" ${a.types.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div></div>
    <div class="fg"><label class="fl">Weekly availability</label><div class="chips" style="gap:6px;margin-bottom:10px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<button class="chip ${a.days.includes(d)?'on':''}" style="height:34px;padding:0 12px" data-a="appday" data-v="${d}" aria-pressed="${a.days.includes(d)}">${d}</button>`).join('')}</div><div class="row" style="gap:10px"><input type="time" class="in" data-m="app.from" value="${a.from}" style="width:140px" aria-label="From"> to <input type="time" class="in" data-m="app.to" value="${a.to}" style="width:140px" aria-label="To"></div></div>
    <div class="fg" style="margin:0"><label class="fl" for="abio">Tutor bio</label><textarea id="abio" class="ta" data-m="app.bio">${esc(a.bio)}</textarea></div>
   </div>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div class="card pcard"><h3 style="margin-bottom:6px">Documents</h3><p class="muted" style="margin:0 0 14px;font-size:13.5px">PDF, JPG or PNG, up to 10 MB each.</p>
     ${docs.map(([k,l,req])=>`<div class="upl ${a.docs[k]?'ok':''}" style="margin-bottom:10px"><span style="color:${a.docs[k]?'var(--g)':'#6b7280'}">${ic(a.docs[k]?'check':'upload')}</span><div style="flex:1;min-width:0"><b>${l}${req?'':' <span class="muted" style="font-weight:400">(optional)</span>'}</b><small style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.docs[k]?esc(a.docs[k]):'No file selected'}</small></div>${a.docs[k]?`<button class="btn gh" style="height:32px;padding:0 10px" data-a="appdocrm" data-v="${k}">Remove</button>`:`<label class="btn o" style="height:32px;padding:0 12px">Upload<input type="file" hidden data-file="doc:${k}" accept=".pdf,.jpg,.jpeg,.png"></label>`}</div>`).join('')}
     <div class="note" style="padding:12px 14px;margin-top:4px">${ic('info','sm')}<div style="font-size:13px">Documents are scanned with OCR to help the Admin read them faster. OCR never approves an application; an Admin makes the final decision.</div></div>
    </div>
    <label class="chk card" style="padding:14px 16px"><input type="checkbox" data-a="appconsent" ${a.consent?'checked':''}><span>I confirm these documents are mine and accurate, and I agree to the CampusTutor tutor guidelines.</span></label>

  </div>`;
 }
 if(a.step==='submitted') return `${back}<div class="card" style="max-width:620px;margin:40px auto;text-align:center;padding:36px"><div class="okc">${ic('check')}</div><h2 style="margin:0 0 6px">Application submitted</h2><p class="muted" style="margin:0 0 6px">Reference TA-2026-0158, submitted ${a.submitted}.</p><p style="margin:0 0 20px;color:#374151">An Admin will review your details and documents. We'll email ${S.profile.email} and notify you here when there's an update. You can keep booking sessions as a Learner meanwhile.</p><div class="row" style="justify-content:center;gap:10px"><button class="btn gh" data-a="nav" data-v="profile">Back to Profile</button><button class="btn p" data-a="appstatus">View Application Status</button></div></div>`;
 // status
 const steps=[['Application submitted',a.submitted,'d'],['Documents checked (OCR assist)','Readability check completed, Sep 8, 2026','d'],['Admin review',ts==='Under Review'?'In progress':ts==='Resubmission Required'?'Paused, waiting for your resubmission':'Completed','d'],['Decision',ts==='Approved'?'Approved on Sep 18, 2026':ts==='Rejected'?'Not approved on Sep 18, 2026':'Pending','']];
 if(ts==='Under Review'){steps[2][2]='c'}
 if(ts==='Resubmission Required'){steps[2][2]='x'}
 if(ts==='Approved'||ts==='Rejected'){steps[3][2]=ts==='Approved'?'d':'x'}
 const pill={'Under Review':'pend','Resubmission Required':'bad','Approved':'ok','Rejected':'bad','Not Applied':'warn'}[ts];
 if(ts==='Not Applied') return `${back}<div class="card empty" style="max-width:560px;margin:40px auto">${ic('grad')}<div style="font-weight:600;color:#1f2937;font-size:17px">You haven't applied as a tutor yet</div><div style="margin:4px 0 16px">Share what you can teach and upload your documents for Admin review.</div><button class="btn p" data-a="apply">Apply as Tutor</button></div>`;
 return `${back}${ph('Tutor Application Status','Reference TA-2026-0158. Tutor approval is decided by the CampusTutor Admin.')}
 <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start">
  <div class="card pcard"><div class="hh"><h3>Status</h3><span class="pill ${pill}" style="font-size:14px;padding:5px 14px">${ts}</span></div>
   <ul class="tl">${steps.map(([l,s,c])=>`<li class="${c}"><span class="k">${c==='d'?ic('check','xs'):c==='x'?ic('x','xs'):''}</span><div><b>${l}</b><span class="muted" style="font-size:13.5px">${s}</span></div></li>`).join('')}</ul>
   ${ts==='Under Review'?`<div class="note" style="padding:12px 16px">${ic('info','sm')}<div style="font-size:13.5px">Reviews usually take 3 to 5 school days. OCR results only help the Admin read your documents; they don't approve anything.</div></div>`:''}
   ${ts==='Resubmission Required'?`<div class="note w" style="padding:12px 16px;margin-bottom:14px">${ic('alert','sm')}<div style="font-size:13.5px"><b>Admin remarks</b>${esc(a.remarks)}</div></div>
    <div class="upl ${a.resub?'ok':'bad'}"><span>${ic(a.resub?'check':'file')}</span><div style="flex:1"><b>Transcript of Records / Grades</b><small>${a.resub?esc(a.resub):'Grades_BSIT_3rdYear.pdf, flagged as unreadable'}</small></div>${a.resub?'':`<label class="btn o" style="height:32px;padding:0 12px">Upload new file<input type="file" hidden data-file="resub" accept=".pdf,.jpg,.jpeg,.png"></label>`}</div>
    <button class="btn p w" style="margin-top:14px" data-a="resubmit" ${a.resub?'':'disabled'}>Resubmit for Review</button>`:''}
   ${ts==='Approved'?`<div class="note g" style="padding:14px 16px">${ic('check','sm')}<div style="font-size:13.5px"><b>Tutor capability added to your account</b>Your Learner access stays active. Use the Learner | Tutor switcher in the sidebar to move between roles with the same account.</div></div><button class="btn p w" style="margin-top:14px" data-a="tutordash">Open Tutor Dashboard</button>`:''}
   ${ts==='Rejected'?`<div class="note r" style="padding:14px 16px">${ic('info','sm')}<div style="font-size:13.5px"><b>Reason from the Admin</b>Your current grades don't meet the minimum requirement for the subjects you selected (grade of 1.75 or better). You can apply again next semester with updated grades.</div></div><button class="btn gh w" style="margin-top:14px" disabled>Apply again (opens January 2027)</button>`:''}
  </div>
  <div class="card pcard"><h3 style="margin-bottom:12px">Submitted details</h3><dl class="kv" style="grid-template-columns:130px 1fr;font-size:14px"><dt>Subjects</dt><dd>${a.subjects.join(', ')}</dd><dt>Topics</dt><dd>${esc(a.topics)}</dd><dt>Rate</dt><dd>${peso(a.rate)} / hour</dd><dt>Session types</dt><dd>${a.types.join(', ')}</dd><dt>Availability</dt><dd>${a.days.join(', ')}, ${a.from} to ${a.to}</dd><dt>Documents</dt><dd>${Object.values(a.docs).filter(Boolean).map(esc).join('<br>')}</dd></dl></div>
 </div>`;
};

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(!el){if(S.pop&&!e.target.closest('.pop')){S.pop=null;render()}return}
 if(el.tagName==='INPUT'&&el.type==='checkbox'){A[el.dataset.a]?.(el.dataset.v,el,e);return}
 if(el.tagName==='A'&&el.dataset.a!=='meetgo')e.preventDefault();
 if(el.disabled)return;
 if(S.pop&&el.dataset.a!=='pop'&&!el.closest('.pop'))S.pop=null;
 A[el.dataset.a]?.(el.dataset.v,el,e);
});
document.addEventListener('input',e=>{const el=e.target,m=el.dataset.m;if(!m)return;
 if(m.startsWith('ov.')){const k=m.split('.');let o=S.ov[Number(k[1])];for(let i=2;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=el.value}else setPath(m,el.value);
 const rr=el.dataset.rr;
 if(rr==='1')render();
 else if(rr==='send')document.getElementById('sendbtn').disabled=!(S.draft.trim()||S.attach);
 else if(rr==='rep'){const f=S.ov[0].f;document.getElementById('repbtn').disabled=!(f.sid&&f.type&&f.desc.trim().length>=20)}
 else if(rr==='rate'){const f=S.ov[0].f;document.getElementById('ratebtn').disabled=!(f.rating&&f.text.trim().length>=10)}
 else if(rr==='del')document.getElementById('cfbtn').disabled=el.value.trim()!=='DELETE';
 if(S.ov[0]&&S.ov[0].t==='resched'){const b=document.getElementById('rsbtn');const f=S.ov[0].f;if(b)b.disabled=!(f.date&&f.start!=null&&f.reason.trim().length>=5)}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.s){const k=el.dataset.s,v=el.value;
  if(k.startsWith('dash.')){S.find=initState().find;S.find[k.slice(5)]=v;go('find');return}
  if(k.startsWith('ov.')){const p=k.split('.');let o=S.ov[Number(p[1])];for(let i=2;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;render();return}
  setPath(k,v);if(k.startsWith('find.'))S.find.shown=4;
  if(k==='tutorStatus'&&v==='Not Applied'&&S.view==='apply')S.app.step='status';
  render();return}
 if(el.dataset.file){const k=el.dataset.file,files=[...el.files];if(!files.length)return;
  if(k==='attach')S.attach=files[0].name;
  if(k.startsWith('doc:'))S.app.docs[k.slice(4)]=files[0].name;
  if(k==='resub')S.app.resub=files[0].name;
  if(k==='evidence')S.ov[0].f.files.push(...files.map(f=>f.name));
  if(k==='photo'){const f=files[0];if(f.size>5e6){S.ov[0].err='That image is over 5 MB. Choose a smaller one.';render();return}const r=new FileReader();r.onload=()=>{S.ov[0].src=r.result;S.ov[0].err=null;render()};r.readAsDataURL(f);return}
  render()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;
 if(f==='gsearch'){const q=e.target.q.value.trim();S.find=initState().find;S.find.q=q;go('find')}
 if(f==='send'){const txt=S.draft.trim();if(!txt&&!S.attach)return;const c=S.convos.find(x=>x.id===S.selConvo);const m={me:1,t:txt||'Sent an attachment',at:'10:32 AM',st:1};if(S.attach)m.file=S.attach;c.msgs.push(m);c.time='Now';S.draft='';S.attach=null;render();
  setTimeout(()=>{m.st=2;S.typing=true;if(S.view==='messages')render()},900);
  setTimeout(()=>{S.typing=false;if(c.id==='ma'&&!c.sentLink){c.sentLink=true;c.msgs.push({me:0,t:"Here's the Zoom link for our Tuesday, Sep 22 session at 1:00 PM.",link:{p:'Zoom',u:'https://zoom.us/j/987654321',sid:'BK-2026-1843'},at:'10:33 AM'})}else if(c.tutor){c.msgs.push({me:0,t:'Noted, thanks Juan!',at:'10:33 AM'})}else{c.msgs.push({me:0,t:'Thanks, Juan. A support agent will reply within 24 hours.',at:'10:33 AM'})}if(S.view==='messages'&&S.selConvo===c.id)render()},2600)}
 if(f==='addint'){const v=e.target.i.value.trim();if(v&&!S.editBuf.interests.includes(v))S.editBuf.interests.push(v);render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.pop){S.pop=null;render()}else if(S.ov.length&&!(S.ov[0].b&&S.ov[0].b.pay==='processing'))closeOv()}});
render();
