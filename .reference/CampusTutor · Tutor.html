<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusTutor · Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
 --sb:#004829;--sb-top:#00331b;--sb-act:#185f3a;--bar:#fac003;--pill:#f8c20a;--rsbg:#002a17;
 --g:#045a2a;--g2:#0b6b33;--g3:#017034;--gs:#f1f9f4;--gs2:#e3f4e9;--gt:#0b6b2c;
 --ink:#111418;--ink2:#374151;--mute:#6b7280;--line:#e5e7ea;--line2:#eef0f2;
 --blue:#1f3fb0;--link:#1d5fd1;--star:#f5b301;--red:#d92d20;--reds:#fff1f1;--amber:#c37414;--ambs:#fff6e8;
 --cls:#fee3e4;--clsb:#fe6167;--clst:#d4222c;--av:#d9f7e2;--avb:#3fbf64;--ses:#cbe3fe;--sesb:#2f7fe0;--sest:#12408a;--un:#e8eaed;--unb:#9aa2ae;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--link)}img{max-width:100%}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.sm{width:16px;height:16px}.ic.xs{width:13px;height:13px}.ic.lg{width:28px;height:28px}.ic.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--bar);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sb{width:266px;flex-shrink:0;background:var(--sb);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.sb .logo{display:block;width:266px;height:86px;background:var(--sb-top)}.sb .logo img{display:block;width:266px;height:86px}
.rs{display:flex;margin:14px 24px 20px;background:var(--rsbg);border-radius:8px}
.rs button{flex:1;border:0;background:transparent;color:#e8efe9;font-weight:500;padding:9px 0;border-radius:7px;font-size:15px}
.rs button.on{background:var(--pill);color:#1b1a05;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.nav{list-style:none;margin:0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:14px;border:0;background:transparent;color:#fff;padding:9.5px 26px;font-size:15px;font-weight:500;text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--sb-act)}.nav button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar)}
.nav .ic{width:21px;height:21px}
.sb hr{border:0;border-top:1px solid rgba(255,255,255,.22);margin:14px 22px}
.sb .campus{margin-top:auto;display:block}.sb .campus img{display:block;width:266px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:86px;display:flex;align-items:center;gap:16px;padding:0 34px 0 36px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #f3f4f5}
.gsearch{flex:0 1 556px;position:relative}
.gsearch input{width:100%;height:44px;border:1px solid #dcdfe3;border-radius:8px;padding:0 48px 0 18px;font-size:14.5px;background:#fff}
.gsearch>button{position:absolute;right:8px;top:7px;border:0;background:none;color:#4b5563;padding:4px}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.12);padding:6px;z-index:40;max-height:420px;overflow:auto}
.gres h6{margin:8px 10px 4px;font-size:12px;color:var(--mute);font-weight:600}
.gres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left}
.gres button:hover,.gres button.hl{background:var(--gs)}
.gres img{width:30px;height:30px;border-radius:50%}
.gres small{color:var(--mute);display:block;font-size:12.5px}
.top .sp{flex:1}
.ibtn{border:0;background:none;color:#4b5563;position:relative;padding:6px;border-radius:8px}.ibtn:hover{background:#f3f4f6}.ibtn .ic{width:25px;height:25px}
.ibtn .n{position:absolute;top:-4px;right:-3px;background:#0b6b33;color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;border:2px solid #fff}
.umenu{display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 6px;border-radius:10px;text-align:left}.umenu:hover{background:#f6f7f8}
.umenu img{width:42px;height:42px;border-radius:50%}.umenu b{display:block;font-size:14px;font-weight:600}.umenu small{color:var(--mute);font-size:13px}
.main{padding:18px 34px 48px 36px;flex:1;min-width:0}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.ph h1{font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.3px}
.ph p{margin:0;color:var(--blue);font-size:15px}.ph p.gr{color:#4b5563}
.ph .sp{flex:1}
.row{display:flex;gap:14px;align-items:center}.muted{color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:7px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;text-decoration:none;line-height:1.1}
.btn.p{background:var(--g);color:#fff}.btn.p:hover{background:#034a22}
.btn.o{background:#fff;color:var(--g);border-color:var(--g3)}.btn.o:hover{background:var(--gs)}
.btn.gh{background:#fff;color:var(--ink2);border-color:#d8dbdf;font-weight:500}.btn.gh:hover{background:#f7f8f9}
.btn.rd{background:#fff;color:var(--red);border-color:#f19d98}.btn.rd:hover{background:var(--reds)}
.btn.rdf{background:#d62f2f;color:#fff}.btn.rdf:hover{background:#bf2323}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.lg{height:44px;font-size:15px;padding:0 20px}.btn.w{width:100%}.btn.sm{height:32px;font-size:13px;padding:0 12px}
.link{border:0;background:none;color:var(--g3);font-weight:600;padding:0;display:inline-flex;align-items:center;gap:6px}
.fl{display:block;font-weight:600;font-size:13.5px;margin:0 0 6px}
.in,.sel,.ta{width:100%;border:1px solid #d7dade;border-radius:7px;height:40px;padding:0 12px;background:#fff;font-size:14px}
.in:focus,.sel:focus,.ta:focus{border-color:var(--g3);outline:none;box-shadow:0 0 0 3px rgba(4,90,42,.12)}
.ta{height:auto;padding:10px 12px;resize:vertical;min-height:86px;line-height:1.5}
.in.bad,.sel.bad{border-color:var(--red);background:#fffafa}.in.flag,.sel.flag{border-color:#e6a23c;background:#fffaf0}
.in[readonly],.in:disabled,.sel:disabled{background:#f6f7f8;color:#5b6270}
.selw{position:relative;display:block}.selw .sel{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer}
.selw .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:#4b5563}
.err{color:var(--red);font-size:12.5px;margin-top:5px}.hint{color:var(--mute);font-size:12.5px;margin-top:5px}
.fg{margin-bottom:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}.chk input{margin-top:2px;accent-color:var(--g);width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:#e3f5e8;color:#0b6b2c}.pill.warn{background:#fdf0dc;color:#b86a0b}.pill.bad{background:#fde6e3;color:#c4261d}.pill.gray{background:#eef0f2;color:#555c66}.pill.blue{background:#e2edff;color:#1d4ed8}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.math{background:#e5f4ea;color:#2f7a4b}.tag.sci{background:#fff1e0;color:#e08417}.tag.cs{background:#e5f4ea;color:#2f7a4b;font-size:11px}.tag.lvl{background:#e3f4fd;color:#1b73b8}.tag.all{background:#f0e7ff;color:#7c3aed}
.chipb{display:inline-flex;align-items:center;gap:6px;background:#e1f5e5;color:#0b5a2a;border-radius:16px;padding:6px 14px;font-weight:600;font-size:14px}
.chipb button{border:0;background:none;padding:0;color:#0b5a2a;display:grid;place-items:center}
.note{display:flex;gap:14px;align-items:flex-start;border-radius:9px;padding:14px 18px;background:#e7f3fe;color:#1e2a4a}
.note>.ic{color:#1d5fd1;width:24px;height:24px;margin-top:1px}
.note.g{background:#ecf6f0}.note.g>.ic{color:var(--g)}
.note.w{background:#fff7e6;border:1px solid #f6dca3}.note.w>.ic{color:#b7791f}
.note.r{background:var(--reds);border:1px solid #f7c8c8}.note.r>.ic{color:var(--red)}
.note b{display:block;margin-bottom:2px}.note p{margin:0}
.popw{position:relative;display:inline-block}
.pop{position:absolute;z-index:45;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(16,20,24,.14);min-width:210px;padding:6px}
.pop.r{left:auto;right:0}
.pop>button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:7px;text-align:left;font-size:14px}
.pop>button:hover{background:#f4f6f5}.pop>button.on{color:var(--g);font-weight:600;background:var(--gs)}.pop>button:disabled{opacity:.45;cursor:not-allowed}
.pop>button.dz{color:var(--red)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
.ddb{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;height:44px;border:1px solid #dcdfe3;border-radius:8px;background:#fff;padding:0 14px;font-size:14.5px;font-weight:500;min-width:200px}
.ddb .ic{color:#4b5563}
.srch{position:relative}.srch input{padding-left:42px;height:44px}.srch>.ic{position:absolute;left:14px;top:12px;color:#4b5563}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line2)}
.tabs button{border:0;background:none;padding:12px 20px 12px;font-size:15.5px;color:#4b5563;position:relative;font-weight:500}
.tabs button.on{color:var(--g);font-weight:600}.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#0e993f;border-radius:2px}
.tabs .cnt{background:#eef0f2;color:#4b5563;font-size:11.5px;border-radius:10px;padding:1px 7px;margin-left:6px;font-weight:600}
.tabs button.on .cnt{background:var(--gs2);color:var(--g)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;color:#1f2937;text-align:left;padding:12px 10px;background:#f7f8f9}
.tbl td{padding:12px 10px;border-top:1px solid var(--line2);vertical-align:middle;font-size:13.5px}
.tbl tr.ck{cursor:pointer}.tbl tr.ck:hover td{background:#f8fbf9}
.tbl tr.hl td{background:#f1f8f3}
.who{display:flex;align-items:center;gap:10px}.who img{width:36px;height:36px;border-radius:50%}
.av{border-radius:50%;object-fit:cover;display:block}
.pager{display:flex;gap:8px;align-items:center}
.pager button{width:38px;height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:600}
.pager button.on{background:var(--g);color:#fff;border-color:var(--g)}.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}.empty .ic{width:38px;height:38px;color:#9aa1a9;margin-bottom:6px}
.empty h3{color:var(--ink);margin:4px 0;font-size:17px}
.stars{display:inline-flex;gap:2px;color:var(--star)}.stars .ic{width:15px;height:15px}.stars .ic.fill{fill:var(--star)}
.rt{display:inline-flex;align-items:center;gap:5px;font-weight:600}.rt .ic{width:16px;height:16px;color:var(--star);fill:var(--star)}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(15,22,18,.45);display:flex;align-items:center;justify-content:center;padding:24px}.ov.nw{animation:fi .15s ease}
.ov.dr{justify-content:flex-end;padding:0}
@keyframes fi{from{opacity:0}to{opacity:1}}
.md{background:#fff;border-radius:14px;width:580px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.22)}.ov.nw .md{animation:up .18s ease}
.md.lg{width:860px}.md.xl{width:1080px}.md.sm{width:480px}
@keyframes up{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.dr .md{border-radius:0;height:100vh;max-height:100vh;width:620px}.ov.nw.dr .md{animation:sl .2s ease}
@keyframes sl{from{transform:translateX(30px)}to{transform:none}}
.mh{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line2)}
.mh h2{margin:0;font-size:19px;font-weight:700}.mh .sub{color:var(--mute);font-size:13px;margin-top:2px}.mh .t{flex:1}
.x{border:0;background:none;color:#4b5563;padding:6px;border-radius:8px}.x:hover{background:#f3f4f6}
.mb{padding:20px 24px;overflow:auto;flex:1}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line2);flex-wrap:wrap}
.mf .l{margin-right:auto}
.kv{display:grid;grid-template-columns:160px 1fr;gap:11px 16px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500}
.sech{font-size:14px;color:var(--ink);font-weight:700;margin:22px 0 10px}
.dlg{text-align:center;padding:30px 30px 24px;position:relative}
.dlg .x{position:absolute;top:16px;right:16px}
.dlg .ci{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#fde7e7;color:#d62f2f}
.dlg .ci .ic{width:34px;height:34px}
.dlg .ci.g{background:#e3f4e8;color:var(--g)}.dlg .ci.w{background:#fff3dc;color:#c27c0e}.dlg .ci.b{background:#e3eeff;color:#1d5fd1}
.dlg h2{margin:0 0 8px;font-size:22px}.dlg p{margin:0 0 14px;color:#4b5563;font-size:15px}
.dlg .bb{display:flex;gap:14px;justify-content:center;margin-top:18px}.dlg .bb .btn{flex:1;max-width:210px;height:46px;font-size:16px}
.alloc{display:grid;grid-template-columns:repeat(3,1fr);background:#fff8dd;border-radius:9px;text-align:center;padding:10px 0}
.alloc div+div{border-left:1px solid #e9dcae}.alloc small{display:block;font-weight:600;font-size:12.5px}.alloc b{font-size:22px;color:#0b5a2a}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #e3f4e8;border-top-color:var(--g);animation:rot .9s linear infinite;margin:10px auto 16px}
@keyframes rot{to{transform:rotate(360deg)}}
.prog{height:8px;border-radius:5px;background:#eef0f2;overflow:hidden}.prog i{display:block;height:100%;background:var(--g2);transition:width .3s}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0f2a1b;color:#fff;border-radius:9px;padding:11px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;animation:up .2s ease}
.toast .ic{color:var(--bar)}.toast button{border:0;background:none;color:var(--bar);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;margin-bottom:22px}
.scard{display:flex;align-items:center;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;width:100%;min-height:112px}
.scard:hover{border-color:#c8cdd2;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.scard.y{background:#fffcf7;border-color:#f6ead0}
.scard .ci{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.scard .ci .ic{width:30px;height:30px}.scard .ci.g{background:#0b6b33}.scard .ci.o{background:#f2a70c}
.scard .n{font-size:25px;font-weight:700;line-height:1.1}.scard .t{font-size:14px;color:#1f2937;margin-top:4px}.scard .s{font-size:13.5px;color:var(--mute);margin-top:6px}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;margin-bottom:22px}
.dg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.ch{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}.ch h3{margin:0;font-size:17.5px;font-weight:600;flex:1}.ch>.ic{width:21px;height:21px}
.qa{display:flex;align-items:center;gap:16px;width:calc(100% - 28px);margin:0 14px 14px;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:12px 14px;text-align:left;font-size:15.5px;font-weight:600}
.qa:hover{border-color:#cfd4d8;background:#fbfcfb}
.qa .ib{width:46px;height:46px;border-radius:7px;display:grid;place-items:center;color:#fff}.qa .ib.g{background:#04542d}.qa .ib.o{background:#f19e00}
.qa>span:not(.ib){flex:1}.qa .ib{flex-shrink:0}
.avs{display:flex;align-items:center;gap:22px;padding:6px 18px 16px;width:100%;border:0;background:none;text-align:left}
.avs .ib{width:60px;height:60px;border-radius:9px;background:#e6f5ea;color:var(--g);display:grid;place-items:center}
.avs .ib.gray{background:#f1f3f4;color:#374151}
.act{display:flex;align-items:center;gap:18px;width:calc(100% - 36px);margin:0 18px;border:0;border-bottom:1px solid var(--line2);background:none;padding:12px 0;text-align:left;font-size:14.5px}
.act:last-child{border-bottom:0}.act:hover span.t{text-decoration:underline}
.act .ib{width:46px;height:36px;border-radius:7px;background:#e6f5ea;color:var(--g);display:grid;place-items:center}.act .ib.b{background:#eef1f7;color:#374151}
.act span.t{flex:1}.act small{color:#4b5563;font-size:13.5px}
/* services */
.svt td{font-size:12.5px;padding:10px 6px}.svt th{padding:12px 6px;font-size:12px}.svt .sv{display:flex;gap:12px;align-items:center}
.svt .sic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.svt .sv b{font-size:14px;display:block}.svt .sv small{color:#4b5563;font-size:12.5px;display:block;line-height:1.35}
.svt .rate{color:#0b6b33;font-weight:700;font-size:14.5px;white-space:nowrap}
.svt .acts{display:flex;gap:6px}.svt .acts .btn{height:38px;padding:0 8px;font-size:12px;white-space:nowrap;text-align:center;line-height:1.1}.svt .acts .btn.rd,.svt .acts .btn[data-a=svcReact]{white-space:normal;width:84px}
.stype{display:flex;flex-direction:column;gap:8px}.stype span{display:flex;gap:6px;align-items:center;color:#374151}
/* calendar */
.aw{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ctb{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;flex-wrap:wrap}
.ctb .ttl{flex:1;text-align:center;font-size:21px;font-weight:700;min-width:250px}
.segw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.segw button{border:0;background:#fff;padding:0 26px;height:42px;font-weight:500;font-size:14.5px}.segw button.on{background:var(--g);color:#fff}
.legend{display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap;font-size:13px;color:#374151;margin:14px 0 12px}
.legend span{display:inline-flex;gap:8px;align-items:center}.legend i{width:15px;height:15px;border-radius:3px;display:inline-block}
.calg{display:grid;position:relative;min-width:980px}

/div><div class=\"s\">Your sessions<\/div><\/span><\/button>\n <\/div>\n <div class=\"card fbox\" style=\"padding:18px 20px\">\n  <h2 style=\"margin:0 0 16px;font-size:19px;font-weight:600\">Find the perfect tutor for you<\/h2>\n  <div class=\"frow\" style=\"grid-template-columns:1fr 1fr 1.5fr 1.5fr;gap:32px;margin-bottom:14px\">\n   <div><div class=\"flbl\" style=\"font-weight:500\">Subject<\/div>${selx('dash.subject','',[['','All Subjects'],...SUBJ])}<\/div>\n   <div><div class=\"flbl\" style=\"font-weight:500\">Level<\/div>${selx('dash.level','',[['','All Levels'],'Introductory','Intermediate','Advanced'])}<\/div>\n   <div><div class=\"flbl\" style=\"font-weight:500\">Availability<\/div>${selx('dash.avail','',[['','All Availability'],['online','Online now'],['today','Available today'],['week','Available this week']])}<\/div>\n   <div><div class=\"flbl\" style=\"font-weight:500\">Sort by<\/div>${selx('dash.sort','Highest Rated',['Highest Rated','Most Reviews','Price: Low to High','Price: High to Low'])}<\/div>\n  <\/div>\n  <div class=\"flbl\" style=\"font-weight:500\">Popular Subjects<\/div>\n  <div class=\"chips\" style=\"gap:16px;margin-bottom:14px\">${['Programming','Calculus','Physics','Chemistry','Statistics','Accounting','English'].map(c=>`<button class=\"chip\" data-a=\"dashchip\" data-v=\"${c}\">${c}<\/button>`).join('')}<div class=\"popw\"><button class=\"chip\" data-a=\"pop\" data-v=\"dashmore\">Filipino ${ic('chev','sm')}<\/button>${S.pop==='dashmore'?`<div class=\"pop\">${['Filipino','Biology','Economics','Algebra','Web Development','Essay Writing'].map(c=>`<button data-a=\"dashchip\" data-v=\"${c}\">${c}<\/button>`).join('')}<\/div>`:''}<\/div><\/div>\n  <div class=\"flbl\" style=\"font-weight:500\">Tutor Categories<\/div>\n  <div class=\"chips\">${CATS.map(([c,i])=>`<button class=\"chip cat\" data-a=\"dashcat\" data-v=\"${c}\">${ic(i,c==='Business'?'o':'')}${c}<\/button>`).join('')}<\/div>\n <\/div>\n <div style=\"display:flex;justify-content:space- argin:0\"><label class=\"fl\" for=\"abio\">Tutor bio<\/label><textarea id=\"abio\" class=\"ta\" data-m=\"app.bio\">${esc(a.bio)}<\/textarea><\/div>\n   <\/div>\n   <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div class=\"card pcard\"><h3 style=\"margin-bottom:6px\">Documents<\/h3><p class=\"muted\" style=\"margin:0 0 14px;font-size:13.5px\">PDF, JPG or PNG, up to 10 MB each.<\/p>\n     ${docs.map(([k,l,req])=>`<div class=\"upl ${a.docs[k]?'ok':''}\" style=\"margin-bottom:10px\"><span style=\"color:${a.docs[k]?'var(--g)':'#6b7280'}\">${ic(a.docs[k]?'check':'upload')}<\/span><div style=\"flex:1;min-width:0\"><b>${l}${req?'':' <span class=\"muted\" style=\"font-weight:400\">(optional)<\/span>'}<\/b><small style=\"display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${a.docs[k]?esc(a.docs[k]):'No file selected'}<\/small><\/div>${a.docs[k]?`<button class=\"btn gh\" style=\"height:32px;padding:0 10px\" data-a=\"appdocrm\" data-v=\"${k}\">Remove<\/button>`:`<label class=\"btn o\" style=\"height:32px;padding:0 12px\">Upload<input type=\"file\" hidden data-file=\"doc:${k}\" accept=\".pdf,.jpg,.jpeg,.png\"><\/label>`}<\/div>`).join('')}\n     <div class=\"note\" style=\"padding:12px 14px;margin-top:4px\">${ic('info','sm')}<div style=\"font-size:13px\">Documents are scanned with OCR to help the Admin read them faster. OCR never approves an application; an Admin makes the final decision.<\/div><\/div>\n    <\/div>\n    <label class=\"chk card\" style=\"padding:14px 16px\"><input type=\"checkbox\" data-a=\"appconsent\" ${a.consent?'checked':''}><span>I confirm these documents are mine and accurate, and I agree to the CampusTutor tutor guidelines.<\/span><\/label>\n    <button class=\"btn p lg\" data-a=\"appsubmit\" ${ok?'':'disabled'}>Submit Application<\/button>\n    ${ok?'':'<div class=\"muted\" style=\"font-size:12.5px;text-align:center;margin-top:-8px\">Complete the required fields and documents to submit.<\/div>'}\n   <\/div>\n  <\/ al is decided by the CampusTutor Admin.')}\n <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start\">\n  <div class=\"card pcard\"><div class=\"hh\"><h3>Status<\/h3><span class=\"pill ${pill}\" style=\"font-size:14px;padding:5px 14px\">${ts}<\/span><\/div>\n   <ul class=\"tl\">${steps.map(([l,s,c])=>`<li class=\"${c}\"><span class=\"k\">${c==='d'?ic('check','xs'):c==='x'?ic('x','xs'):''}<\/span><div><b>${l}<\/b><span class=\"muted\" style=\"font-size:13.5px\">${s}<\/span><\/div><\/li>`).join('')}<\/ul>\n   ${ts==='Under Review'?`<div class=\"note\" style=\"padding:12px 16px\">${ic('info','sm')}<div style=\"font-size:13.5px\">Reviews usually take 3 to 5 school days. OCR results only help the Admin read your documents; they don't approve anything.<\/div><\/div>`:''}\n   ${ts==='Resubmission Required'?`<div class=\"note w\" style=\"padding:12px 16px;margin-bottom:14px\">${ic('alert','sm')}<div style=\"font-size:13.5px\"><b>Admin remarks<\/b>${esc(a.remarks)}<\/div><\/div>\n    <div class=\"upl ${a.resub?'ok':'bad'}\"><span>${ic(a.resub?'check':'file')}<\/span><div style=\"flex:1\"><b>Transcript of Records / Grades<\/b><small>${a.resub?esc(a.resub):'Grades_BSIT_3rdYear.pdf, flagged as unreadable'}<\/small><\/div>${a.resub?'':`<label class=\"btn o\" style=\"height:32px;padding:0 12px\">Upload new file<input type=\"file\" hidden data-file=\"resub\" accept=\".pdf,.jpg,.jpeg,.png\"><\/label>`}<\/div>\n    <button class=\"btn p w\" style=\"margin-top:14px\" data-a=\"resubmit\" ${a.resub?'':'disabled'}>Resubmit for Review<\/button>`:''}\n   ${ts==='Approved'?`<div class=\"note g\" style=\"padding:14px 16px\">${ic('check','sm')}<div style=\"font-size:13.5px\"><b>Tutor capability added to your account<\/b>Your Learner access stays active. Use the Learner | Tutor switcher in the sidebar to move between roles with the same account.<\/div><\/div><button class=\"btn p w\" style=\"margin-top:14px\" data-a=\"tutordash\">Open Tutor Dashboard<\/button>`:' pan class=\"ci\" style=\"background:#e6f5ea;color:var(--g)\">${ic('lock')}<\/span><div><h3>Account &amp; Security<\/h3><p>Manage your account credentials and security settings.<\/p><\/div><\/div>\n   <div class=\"fg\"><label class=\"fl\" style=\"font-weight:500\">Email Address<\/label><div style=\"position:relative\"><input class=\"in\" value=\"${S.profile.email}\" disabled><span class=\"pill ok\" style=\"position:absolute;right:8px;top:9px\">${ic('check','xs')}Verified<\/span><\/div><\/div>\n   ${pw('cur','Current Password','Enter current password')}${pw('nw','New Password','Enter new password')}${pw('cf','Confirm New Password','Confirm new password')}\n   <button class=\"btn p w lg\" data-a=\"pwupdate\">Update Password<\/button><\/div>\n  <div class=\"card pcard\"><div class=\"sh\"><span class=\"ci\" style=\"background:#fff3d6;color:#e59b0c\">${ic('bell')}<\/span><div><h3>Notifications<\/h3><p>Choose what you want to be notified about.<\/p><\/div><\/div>\n   ${t('booking','cal','#e6f5ea','var(--g)','Booking Notifications','Get notified about booking requests and confirmations.')}${t('remind','bell','#e6f5ea','var(--g)','Session Reminders','Receive reminders for upcoming sessions.')}${t('msgs','msg','#e6f5ea','var(--g)','Messages','Get notified about new messages from tutors.')}${t('pay','wallet','#fff3d6','#e59b0c','Payment Notifications','Receive updates about payments and transactions.')}${t('rev','star','#fff3d6','#e59b0c','Review Reminders','Get reminded to leave reviews for completed sessions.')}${t('sys','info','#e5efff','#1d5fd1','System Notifications','Important updates and announcements from CampusTutor.')}<\/div>\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n   <div class=\"card pcard\"><div class=\"sh\"><span class=\"ci\" style=\"background:#e5efff;color:#1d5fd1\">${ic('sliders')}<\/span><div><h3>Preferences<\/h3><p>Customize your learning experience.<\/p><\/div><\/div>\n    ${[['lang','globe','Language',['English','Filipino']],['tz','clock','Timezone',['(GMT+08:00) Asia/Manila']],['fmt','cal','Date Format',['Sep 12, 2026 (MMMM DD, YYYY)','20/05/2026 (DD/MM/YYYY)','2026-09-12 (YYYY-MM-DD)']]].map(([k,i,l,o])=>`<div class=\"nrow\" style=\"align-items:center\"><span style=\"color:#374151\">${ic(i)}<\/span><div style=\"flex:1\"><label class=\"fl\" style=\"font-weight:500;margin-bottom:5px\">${l}<\/label>${selx('settings.'+k,s[k],o,'style=\"color:var(--ink)\"'+(k==='tz'?' disabled':''))}<\/div><\/div>`).join('')}<\/div>\n   <div class=\"card pcard\"><div class=\"sh\"><span class=\"ci\" style=\"background:#e5efff;color:#1d5fd1\">${ic('shield')}<\/span><div><h3>Privacy &amp; Visibility<\/h3><p>Manage your privacy and visibility settings.<\/p><\/div><\/div>\n    <div class=\"nrow\" style=\"align-items:center\"><span style=\"color:#374151\">${ic('eye')}<\/span><div style=\"flex:1\"><label class=\"fl\" style=\"font-weight:500;margin-bottom:5px\">Profile Visibility<\/label>${selx('settings.vis',s.vis,['Registered users only','My tutors only','Only me'],'style=\"color:var(--ink)\"')}<\/div><\/div>\n    <div class=\"nrow\"><span style=\"color:#374151\">${ic('users')}<\/span><div><b style=\"font-weight:500\">Show My Activity<\/b><small>Allow others to see your learning activity (e.g., subjects learned, reviews given).<\/small><\/div><button class=\"tog ${s.activity?'on':''}\" data-a=\"stog\" data-v=\"activity\" role=\"switch\" aria-checked=\"${s.activity}\" aria-label=\"Show my activity\"><\/button><\/div><\/div>\n  <\/div>\n <\/div>\n <div style=\"display:grid;grid-template-columns:1.45fr 1.55fr;gap:24px;margin-top:18px\">\n  <div class=\"card pcard\"><div class=\"sh\" style=\"margin-bottom:10px\"><span class=\"ci\" style=\"background:#fde8e8;color:var(--red)\">${ic('db')}<\/span><div><h3>Data Management<\/h3><p>Manage your data and account information.<br>You can request a copy of your data or delete your account permanently. This action cannot be undone.<\/p><\/div><\/div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\"><button class=\"btn o lg\" data-a=\"reqdata\">${ic('download','sm')}Request My Data<\/button><button class=\"btn rd lg\" data-a=\"delacct\">${ic('trash','sm')}Delete Account<\/button><\/div><\/div>\n  <div class=\"note\" style=\"padding:24px 26px\">${ic('info')}<div><b style=\"font-size:16px\">Security Reminder<\/b><span style=\"font-size:14.5px;color:#374151\">Keep your account secure. Do not share your password with anyone. If you notice any suspicious activity, please contact the CampusTutor support team immediately.<\/span><\/div><\/div>\n <\/div>`;\n};\nconst HELP=[\n {k:'start',i:'rocket',bg:'#e6f5ea',fg:'var(--g)',t:'Getting Started',d:'Learn the basics of using CampusTutor as a learner.',arts:[['What is CampusTutor?','CampusTutor connects CarSU learners with verified CSU student tutors. You sign in with your CarSU account, find a tutor, book and pay in one place, and coordinate through in-app messages.'],['How do I switch between Learner and Tutor?','If an Admin has approved your tutor application, use the Learner | Tutor switcher in the sidebar. Both roles use the same account.']]},\n {k:'find',i:'search',bg:'#e6f5ea',fg:'var(--g)',t:'Finding a Tutor',d:'How to search, filter, and choose the right tutor.',arts:[['How do I filter tutors?','Use Subject, Level, Availability and Sort By, or tap Popular Subjects and Tutor Categories. Active filters appear as chips you can remove one by one.'],['What does Verified mean?','Every listed tutor has passed credential review by the CampusTutor Admin.']]},\n {k:'book',i:'cal',bg:'#e5efff',fg:'#1d5fd1',t:'Booking Sessions',d:'How to book, reschedule, or manage your tutoring sessions.',arts:[['How do I book a session?','Open a tutor\u2019s profile or tap Book Now. Choose the subject and specific topic, pick a date and an available time range, choose Online or In-Person, review the Booking Summary, then pay with GCash through PayMongo. Your confirmation is sent to your CarSU email.'],['How ngs.',arts:[['How do I change my password?','Go to Settings, Account & Security, and enter your current and new password.'],['How do I change my Student ID or email?','These come from CarSU records. Contact the support team to request a correction.']]}\n];\nconst POPULAR=['How do I book a session?','How do payments work?','What is the cancellation policy?','How do I leave a review?','How do I become a tutor?'];\nconst allArts=()=>HELP.flatMap(c=>c.arts.map(a=>({c,q:a[0],a:a[1]})));\nV.help=()=>{\n const h=S.help,q=h.q.trim().toLowerCase();\n let main;\n if(q){const r=allArts().filter(x=>(x.q+x.a).toLowerCase().includes(q));main=`<div class=\"ftitle\">${r.length} result${r.length===1?'':'s'} for \u201c${esc(h.q)}\u201d<\/div>${r.length?`<div class=\"card\" style=\"padding:6px 20px\">${r.map(x=>`<button class=\"art\" data-a=\"article\" data-v=\"${esc(x.q)}\">${ic('file')}<span>${esc(x.q)}<\/span><span class=\"muted\" style=\"margin-left:auto;font-size:13px\">${x.c.t}<\/span><\/button>`).join('')}<\/div>`:`<div class=\"card empty\">${ic('search')}<div>No articles match. Try \u201cpayment\u201d or \u201creschedule\u201d, or contact support.<\/div><\/div>`}`;}\n else if(h.cat){const c=HELP.find(x=>x.k===h.cat);main=`<button class=\"link\" data-a=\"hcat\" data-v=\"\" style=\"margin:4px 0 10px\">${ic('back','sm')}All help categories<\/button><div class=\"card hcat\" style=\"margin-bottom:14px\"><span class=\"ci\" style=\"background:${c.bg};color:${c.fg}\">${ic(c.i)}<\/span><div><b>${c.t}<\/b><span>${c.d}<\/span><\/div><\/div><div class=\"card\" style=\"padding:6px 20px\">${c.arts.map(a=>`<button class=\"art\" data-a=\"article\" data-v=\"${esc(a[0])}\">${ic('file')}<span>${esc(a[0])}<\/span>${ic('chevR','sm')}<\/button>`).join('')}<\/div>`;}\n else if(h.all){main=`<button class=\"link\" data-a=\"hall\" data-v=\"0\" style=\"margin:4px 0 10px\">${ic('back','sm')}All help categories<\/button><div class=\"ftitle\">All articles<\/div><div class=\"card\" style=\"padding:6px 20px\">${allArts().map(x=>`<button class=\"art\" data-a=\"article\" data-v=\"${esc(x.q)}\">${ic('file')}<span>${esc(x.q)}<\/span><span class=\"muted\" style=\"margin-left:auto;font-size:13px\">${x.c.t}<\/span><\/button>`).join('')}<\/div>`;}\n else main=`<h2 style=\"font-size:21px;margin:0 0 14px\">Help Categories<\/h2><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 30px\">${HELP.map(c=>`<button class=\"card hcat\" data-a=\"hcat\" data-v=\"${c.k}\"><span class=\"ci\" style=\"background:${c.bg};color:${c.fg}\">${ic(c.i)}<\/span><span><b>${c.t}<\/b><span>${c.d}<\/span><\/span>${ic('chevR')}<\/button>`).join('')}<\/div>`;\n return `<div class=\"hw\"><div>${ph('Help &amp; Support','Find answers to common questions or contact our support team.')}\n  <div style=\"position:relative;margin-bottom:22px\"><span style=\"position:absolute;left:16px;top:12px;color:#4b5563\">${ic('search')}<\/span><input class=\"in\" style=\"height:48px;padding-left:50px\" data-m=\"help.q\" data-rr=\"1\" value=\"${esc(h.q)}\" placeholder=\"Search help topics...\" aria-label=\"Search help topics\"><\/div>\n  ${main}\n  <div class=\"note\" style=\"margin-top:26px;padding:22px 26px\">${ic('info')}<div><b style=\"font-size:16px\">Safety Reminder<\/b><span style=\"font-size:14.5px;color:#374151\">For your safety, keep booking, payment, and important session coordination within CampusTutor.<br>Report any suspicious or inappropriate activity through our platform.<\/span><\/div><\/div><\/div>\n  <div style=\"display:flex;flex-direction:column;gap:22px;padding-top:24px\">\n   <div class=\"card\" style=\"background:var(--g-soft);border-color:#e3efe6;text-align:center;padding:24px 40px\"><div style=\"width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 14px;color:var(--g)\">${ic('headset','lg')}<\/div><b style=\"font-size:19px\">Need More Help?<\/b><p style=\"color:#374151;margin:8px 0 16px\">Can't find what you're looking for?<br>Our support tea  style=\"font-size:15.5px\">${s.s}<\/b> <span class=\"muted\" style=\"font-size:13px\">${t.cat}<\/span><\/div><div class=\"row\" style=\"gap:12px\"><span style=\"font-weight:600;color:var(--g2)\">${peso(t.rate)} / hour<\/span><button class=\"btn o\" style=\"height:32px;padding:0 12px\" data-a=\"bookSvc\" data-v=\"${id}|${esc(s.s)}\">Book this service<\/button><\/div><\/div><div class=\"chips\" style=\"gap:6px;margin-top:10px\">${s.topics.map(x=>`<span class=\"chip\" style=\"height:28px;padding:0 10px;font-size:12.5px;cursor:default\">${x}<\/span>`).join('')}<\/div><\/div>`).join('')}\n  <div class=\"kv\" style=\"margin-top:6px;grid-template-columns:150px 1fr;font-size:14px\"><dt>Session types<\/dt><dd>${t.types.join(', ')}<\/dd><dt>Online platform<\/dt><dd style=\"display:flex;gap:6px;align-items:center\">${t.platform==='Zoom'?zoomIc:meetIc}${t.platform} (external link shared after booking)<\/dd><dt>In-person location<\/dt><dd>${t.location}<\/dd><dt>Levels<\/dt><dd>${t.levels.join(', ')}<\/dd><\/div>\n  <div class=\"sech\">Weekly availability<\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:6px\">${dn.map((d,i)=>`<div style=\"border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;${(t.avail[d]||[]).length?'background:var(--g-soft);border-color:#cfe9d7':''}\"><div style=\"font-weight:600;font-size:13px\">${days[i].slice(0,3)}<\/div><div style=\"font-size:12px;color:${(t.avail[d]||[]).length?'var(--g)':'#9aa1a9'};margin-top:4px\">${(t.avail[d]||[]).map(([a,b])=>`${fT(a).replace(':00','')}\u2013${fT(b).replace(':00','')}`).join('<br>')||'Unavailable'}<\/div><\/div>`).join('')}<\/div>\n  <div class=\"muted\" style=\"font-size:12.5px;margin-top:6px\">Only open, conflict-free times are offered when you book.<\/div>\n  <div class=\"sech\">Ratings and reviews<\/div>\n  ${(TREV[id]||[]).map(r=>`<div style=\"border-bottom:1px solid var(--line2);padding:10px 0\"><div class=\"row\" style=\"justify-content:space-between\"><b style e a specific topic<\/h3><p class=\"muted\" style=\"margin:0 0 14px\">${b.service}<\/p>${s.topics.map(x=>`<button class=\"opt ${b.topic===x?'on':''}\" data-a=\"bk\" data-v=\"topic|${esc(x)}\"><span class=\"rd\"><\/span><span><b>${x}<\/b><\/span><\/button>`).join('')}`;foot=back+`<button class=\"btn p\" data-a=\"bk\" data-v=\"next\" ${b.topic?'':'disabled'}>Continue<\/button>`;}\n if(b.step===3){const [y,m]=b.month.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),off=first.getUTCDay();\n  let cells='';for(let i=0;i<off;i++)cells+='<span><\/span>';\n  for(let d=1;d<=dim;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,av=bookable(b.tutor,ds,b.dur);cells+=`<button class=\"d ${av?'av':''} ${b.date===ds?'on':''} ${ds===TODAY?'today':''}\" ${av?`data-a=\"bk\" data-v=\"date|${ds}\"`:'disabled'} aria-label=\"${fD(ds)}${av?', available':', unavailable'}\">${d}<\/button>`}\n  const sl=b.date?slots(b.tutor,b.date,b.dur):[];\n  body=`<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\"><div><h3 style=\"margin:0 0 10px\">Select a date<\/h3><div class=\"cal\"><div class=\"hd\"><button data-a=\"bk\" data-v=\"mon|-1\" ${b.month<='2026-05'?'disabled':''} aria-label=\"Previous month\">${ic('chevL','sm')}<\/button><span>${MON[m-1]} ${y}<\/span><button data-a=\"bk\" data-v=\"mon|1\" ${b.month>='2026-07'?'disabled':''} aria-label=\"Next month\">${ic('chevR','sm')}<\/button><\/div><div class=\"g7\">${['S','M','T','W','T','F','S'].map(x=>`<span class=\"dw\">${x}<\/span>`).join('')}${cells}<\/div><\/div><div class=\"row\" style=\"gap:14px;font-size:12.5px;margin-top:8px\" ><span class=\"row\" style=\"gap:6px\"><span style=\"width:12px;height:12px;border-radius:3px;background:var(--g-soft);border:1px solid #cfe9d7\"><\/span>Available<\/span><span class=\"row\" style=\"gap:6px\"><span style=\"width:12px;height:12px;border-radius:3px;background:var(--g)\"><\/span>Selected<\/span><\/div><\/div>\n  <di function occupied(date,excl){ // hard blocks: classes + confirmed/pending sessions
 const out=[];if(S.cs.state!=='none')S.classes.forEach(c=>{if(c.day===dow(date))out.push({k:'cls',s:c.s,e:c.e,c})});

const ov=(a,b,c,d)=>a<d&&c<b;
function availSegs(date,{future=false}={}){ // availability minus sessions
 const res=[];const sesI=S.sessions.filter(x=>x.date===date&&['Confirmed','Pending','Completed'].includes(x.st)).map(x=>[x.s,sEnd(x)]);
 S.avail.filter(a=>a.date===date&&a.kind==='avail').forEach(a=>{let segs=[[a.s,a.e]];sesI.forEach(([s,e])=>{segs=segs.flatMap(([x,y])=>ov(x,y,s,e)?[[x,Math.max(x,Math.min(y,s))],[Math.min(y,Math.max(x,e)),y]].filter(([p,q])=>q-p>0):[[x,y]])});
  segs.forEach(([x,y])=>{if(future){if(date<TODAY)return;if(date===TODAY){if(y<=NOWM)return;x=Math.max(x,Math.ceil(NOWM/30)*30)}}if(y-x>0)res.push({a,s:x,e:y})})});return res}

 const out=[];for(let i=0;i<days;i++){const d=addD(TODAY,i+1>0?i:i);availSegs(d,{future:true}).forEach(g=>{if(isConflictAvail(g.a))return;if(mode&&g.a.mode!=='Both'&&g.a.mode!==mode)return;

 book:{t:'Booking & Session Guidelines',i:'cal',p:'Accept only valid bookings, keep session details current, and use Request Reschedule when a time change is needed.',more:['Learners book from your Tutoring Availability only; class times and existing sessions are excluded.','A booking is Pending until the learner’s GCash payment through PayMongo succeeds, then it becomes Confirmed.','If you can’t make it, send a Request Reschedule with a clear reason. The booking changes only if the learner accepts.','Share the external meeting link in Messages before online sessions.']},

 conduct:{t:'Tutor Code of Conduct',i:'conduct',p:'Be respectful, prepared, punctual, academically honest, and professional in every interaction.',more:['Don’t complete graded work for learners; guide them to understand it.','Keep communication in CampusTutor Messages.','Start and end sessions on time.']},
 safety:{t:'Safety Guidelines',i:'shieldx',p:'Protect account credentials, use approved public campus locations for in-person sessions, and avoid sharing unnecessary personal information.',more:['Meet in approved public spaces such as the CCIS Learning Commons.','Never share your password or OTP, including with CampusTutor staff.','Report anything that makes you feel unsafe.']},

 return `<div class="card hs" id="h-${k}"><span class="hi">${ic(h.i)}</span><div><h3>${h.t}</h3><p>${mark(h.p,q)}</p></div><button class="tg" data-a="helpT" data-v="${k}" aria-expanded="${open}" aria-label="${open?'Collapse':'Expand'} ${h.t}">${ic(open?'chevU':'chev')}</button>

 const a=document.activeElement,fid=a&&a.id,fds=a&&a.dataset&&a.dataset.s,fa=a&&a.dataset&&a.dataset.a&&a.dataset.a+'|'+(a.dataset.v||'');let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
